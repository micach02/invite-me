<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F7F4" />
    <script>
      /* Apply the saved (or OS) colour scheme before first paint so dark mode doesn't flash white. */
      (function () {
        try {
          var s = localStorage.getItem('inviteme-theme');
          var dark = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#131613');
          }
        } catch (e) {}
      })();
    </script>
    <title>InviteMe — Beautiful Digital Invitations</title>
    <meta name="description" content="Create, customize and share beautiful digital invitations for weddings, birthdays, baptisms and more. Collect RSVPs and track views." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Dancing+Script:wght@500;700&family=Montserrat:wght@300;400;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;600&family=Fredoka:wght@400;600&family=Bebas+Neue&family=Cinzel:wght@400;600&family=Pacifico&family=Syne:wght@600;700&family=Abril+Fatface&family=Space+Grotesk:wght@400;600&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Serif+Display&family=Josefin+Sans:wght@400;600&family=Space+Mono:wght@400;700&family=Limelight&family=Italiana&family=Shrikhand&family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
